---
# 1. ClusterRoleBinding: Привязка группы ИБ к роли security-admin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-admin-binding
subjects:
- kind: Group
  name: propdev-security-admins # Должно совпадать с O= в сертификате
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: security-admin
  apiGroup: rbac.authorization.k8s.io

---
# 2. ClusterRoleBinding: Привязка группы аналитиков к роли cluster-viewer
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-viewer-binding
subjects:
- kind: Group
  name: propdev-auditors
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-viewer
  apiGroup: rbac.authorization.k8s.io

---
# 3. RoleBinding: Привязка группы DevOps к роли namespace-manager в namespace zhku
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zhku-devops-binding
  namespace: zhku
subjects:
- kind: Group
  name: propdev-devops
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: namespace-manager
  apiGroup: rbac.authorization.k8s.io